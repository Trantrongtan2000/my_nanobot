stages:
  - validate

validate_markdown_and_cleanliness:
  stage: validate
  image: python:3.11-slim
  script:
    - echo "Validating Markdown files for raw tool_call tags..."
    - python -c "
import glob, sys
has_error = False
for file in glob.glob('**/*.md', recursive=True):
    with open(file, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
        if '<tool_call>' in content or '<function=' in content:
            print(f'ERROR: Raw tool_call tag found in {file}')
            has_error = True
if has_error:
    sys.exit(1)
print('SUCCESS: All Markdown files are clean!')
"
